[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-telemetry-lakehouse"
version = "0.1.0"
description = "Synthetic UAV telemetry through a bronze/silver/gold Delta Lake pipeline"
requires-python = ">=3.11"
dependencies = []  # the generator is stdlib only; Spark deps arrive with bronze

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
uav-generate = "uav_lakehouse.generator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
